# Netlify builds the customer site (apps/web) from this monorepo.
# Set these in Netlify under Site configuration > Environment variables (never commit them):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY

[build]
  base = "apps/web"
  command = "pnpm build"
  # Relative to the base directory. Without this, Netlify guessed apps/admin/.next from the monorepo.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
